[package]
version = "1.0.2"
edition = "2021"
license = "MIT"

name = "sanctuary-seeder"
description = "A seed finder and checker for Monster Sanctuary."

authors = ["Minavoii"]
repository = "https://github.com/Minavoii/sanctuary-seeder"
readme = "README.md"

build = "build/main.rs"

[dependencies]
slint = "1.11.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
rmp-serde = "1.3.0"
rusqlite = { version = "0.35.0", features = ["bundled"] }
image = "0.25.6"
unity-random = "1.0.0"
open = "5.3.2"

[build-dependencies]
slint-build = "1.11.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
rmp-serde = "1.3.0"
texture_packer = "0.30.0"
image = "0.25.6"
winresource = "0.1.20"
